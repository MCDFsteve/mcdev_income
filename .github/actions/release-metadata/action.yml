name: Release metadata
description: Read the app version and common release filename prefix
outputs:
  version:
    description: App version including its build number
    value: ${{ steps.metadata.outputs.version }}
  basename:
    description: Release filename prefix including the app version
    value: ${{ steps.metadata.outputs.basename }}
  notes-file:
    description: Version-specific release notes, if available
    value: ${{ steps.metadata.outputs.notes-file }}
runs:
  using: composite
  steps:
    - id: metadata
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9]+)?$ ]]; then
          echo "Invalid app version: $VERSION" >&2
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "basename=mcdev-income-$VERSION" >> "$GITHUB_OUTPUT"
        NOTES="docs/releases/$VERSION.md"
        if [[ -f "$NOTES" ]]; then
          echo "notes-file=$NOTES" >> "$GITHUB_OUTPUT"
        fi
