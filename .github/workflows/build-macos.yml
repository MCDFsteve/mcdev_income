name: Build macOS

on:
  workflow_call:
    outputs:
      artifact-name:
        description: macOS artifact name
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build macOS
    runs-on: macos-latest
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release metadata
        id: metadata
        uses: ./.github/actions/release-metadata

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS (release)
        run: flutter build macos --release

      - name: Package macOS app
        id: package
        env:
          RELEASE_BASENAME: ${{ steps.metadata.outputs.basename }}
        run: |
          set -euo pipefail
          RELEASE_DIR="build/macos/Build/Products/Release"
          APP_DIR=$(find "$RELEASE_DIR" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app bundle found in $RELEASE_DIR"
            ls -la "$RELEASE_DIR"
            exit 1
          fi
          APP_NAME=$(basename "$APP_DIR")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/Contents/Info.plist")
          ARCHS=$(lipo -archs "$APP_DIR/Contents/MacOS/$EXECUTABLE")
          if [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]; then
            ARCH="arm64-x86_64"
          elif [[ "$ARCHS" == "arm64" || "$ARCHS" == "x86_64" ]]; then
            ARCH="$ARCHS"
          else
            echo "Unsupported macOS architectures: $ARCHS" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP_DIR"
          ARTIFACT="$RELEASE_BASENAME-macos-$ARCH"
          echo "artifact-name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "path=$RELEASE_DIR/$ARTIFACT.zip" >> "$GITHUB_OUTPUT"
          cd "$RELEASE_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "$ARTIFACT.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
