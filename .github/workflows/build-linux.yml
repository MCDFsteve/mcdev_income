name: Build Linux

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Linux artifact name
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.metadata.outputs.basename }}-linux-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release metadata
        id: metadata
        uses: ./.github/actions/release-metadata

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package Linux build
        env:
          RELEASE_BASENAME: ${{ steps.metadata.outputs.basename }}
        run: |
          set -euo pipefail
          tar -czf "$RELEASE_BASENAME-linux-x86_64.tar.gz" -C build/linux/x64/release bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.basename }}-linux-x86_64
          path: ${{ steps.metadata.outputs.basename }}-linux-x86_64.tar.gz
          if-no-files-found: error
