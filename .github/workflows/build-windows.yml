name: Build Windows

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Windows artifact name
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ steps.metadata.outputs.basename }}-windows-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release metadata
        id: metadata
        uses: ./.github/actions/release-metadata

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        env:
          RELEASE_BASENAME: ${{ steps.metadata.outputs.basename }}
        run: |
          $source = "build/windows/x64/runner/Release/*"
          $dest = "${env:RELEASE_BASENAME}-windows-x86_64.zip"
          Compress-Archive -Path $source -DestinationPath $dest

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.basename }}-windows-x86_64
          path: ${{ steps.metadata.outputs.basename }}-windows-x86_64.zip
          if-no-files-found: error
